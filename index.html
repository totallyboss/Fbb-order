<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archie is in town, let's go to Flying Burrito Brothers!</title>
<style>
  :root{
    --red:#c0392b; --dark:#2b1810; --cream:#fdf6e9; --teal:#0a7d6f; --gold:#e0a330;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:var(--cream); color:var(--dark);
  }
  header{
    background:var(--red); color:#fff; padding:20px 16px; text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,0.15);
  }
  header h1{margin:0; font-size:1.4rem; letter-spacing:0.5px;}
  header p{margin:4px 0 0; font-size:0.85rem; opacity:0.9;}
  .container{max-width:640px; margin:0 auto; padding:16px;}
  .name-box{
    background:#fff; border-radius:10px; padding:16px; margin-bottom:16px;
    box-shadow:0 1px 4px rgba(0,0,0,0.08);
  }
  .name-box input{
    width:100%; padding:10px; font-size:1rem; border:1px solid #ddd; border-radius:6px;
  }
  .name-box label{font-weight:600; display:block; margin-bottom:6px;}
  .section{margin-bottom:20px;}
  .section-title{
    background:var(--teal); color:#fff; padding:8px 12px; border-radius:6px 6px 0 0;
    font-size:0.95rem; font-weight:700; text-transform:uppercase; letter-spacing:0.5px;
  }
  .section-title.kids{
    background:var(--gold); color:var(--dark);
  }
  .items{background:#fff; border-radius:0 0 8px 8px; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,0.08);}
  .item{
    display:flex; align-items:center; padding:12px; border-bottom:1px solid #f0e6d6; gap:10px;
  }
  .item:last-child{border-bottom:none;}
  .item input[type=checkbox]{width:20px; height:20px; flex-shrink:0; accent-color:var(--red);}
  .item-info{flex:1; min-width:0;}
  .item-name{font-weight:600; font-size:0.95rem;}
  .item-desc{font-size:0.8rem; color:#777; margin-top:2px;}
  .item-price{font-weight:700; color:var(--red); font-size:0.9rem; white-space:nowrap;}
  .qty-controls{
    display:flex; align-items:center; gap:6px; margin-top:6px;
  }
  .qty-controls button{
    width:26px; height:26px; border-radius:50%; border:1px solid var(--red); background:#fff;
    color:var(--red); font-weight:700; font-size:1rem; cursor:pointer;
  }
  .qty-controls span{min-width:16px; text-align:center; font-weight:600;}
  .note-input{
    width:100%; margin-top:6px; padding:6px; font-size:0.8rem; border:1px solid #eee;
    border-radius:5px; display:none;
  }
  .submit-bar{
    position:sticky; bottom:0; background:var(--cream); padding:12px 0; margin-top:10px;
  }
  .submit-btn{
    width:100%; padding:16px; background:var(--red); color:#fff; border:none; border-radius:10px;
    font-size:1.05rem; font-weight:700; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,0.2);
    transition:background 0.2s ease;
  }
  .submit-btn:disabled{background:#ccc; cursor:not-allowed;}
  .view-toggle{
    display:flex; justify-content:center; gap:8px; margin:12px 0;
  }
  .view-toggle button{
    padding:8px 16px; border-radius:20px; border:1px solid var(--red); background:#fff;
    color:var(--red); font-weight:600; cursor:pointer; font-size:0.85rem;
  }
  .view-toggle button.active{background:var(--red); color:#fff;}
  .summary-card{
    background:#fff; border-radius:10px; padding:16px; margin-bottom:12px;
    box-shadow:0 1px 4px rgba(0,0,0,0.08);
  }
  .summary-person{font-weight:700; color:var(--teal); margin-bottom:6px; font-size:1rem;}
  .summary-line{font-size:0.9rem; padding:3px 0; display:flex; justify-content:space-between;}
  .summary-note{font-size:0.78rem; color:#888; font-style:italic; margin-left:4px;}
  .agg-line{
    display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #f0e6d6;
    font-size:0.95rem;
  }
  .agg-line:last-child{border-bottom:none;}
  .agg-count{font-weight:700; color:var(--red);}
  .total-bar{
    background:var(--dark); color:#fff; border-radius:10px; padding:14px; text-align:center;
    font-weight:700; font-size:1.1rem; margin-top:10px;
  }
  .empty-state{text-align:center; color:#999; padding:30px; font-size:0.9rem;}
  .status-msg{
    text-align:center; padding:10px; border-radius:8px; margin-bottom:12px; font-size:0.9rem; font-weight:600;
  }
  .status-ok{background:#e3f4e9; color:#1e7a44;}
  .status-err{background:#fbe4e4; color:#a0342a;}
  .refresh-btn{
    display:block; margin:0 auto 12px; padding:8px 16px; border-radius:20px; border:1px solid #999;
    background:#fff; color:#555; font-size:0.8rem; cursor:pointer;
  }
</style>
</head>
<body>

  <h1>🌯 Archie is in town, let's go to Flying Burrito Brothers!</h1>
  <p>Group Order — pick your items below</p>
</header>

    <p style="text-align:center; font-size:0.8rem; color:#888; margin-top:8px;">

  ]},

    { name: "Kids Drink \u2014 Pineapple Juice", desc: "", price: 3.50 },
    { name: "Kids Drink \u2014 Milk", desc: "", price: 5.00 },
  ]},
];

function itemKey(sIdx, iIdx){ return `${sIdx}-${iIdx}`; }

function renderMenu(){
  const container = document.getElementById('menuContainer');
  container.innerHTML = '';
  MENU.forEach((section, sIdx) => {
    const secDiv = document.createElement('div');
    secDiv.className = 'section';
    const title = document.createElement('div');
    title.className = 'section-title' + (section.kids ? ' kids' : '');
    title.textContent = section.section;
    secDiv.appendChild(title);
    const itemsDiv = document.createElement('div');
    itemsDiv.className = 'items';
    section.items.forEach((item, iIdx) => {
      const key = itemKey(sIdx, iIdx);
      const row = document.createElement('div');
      row.className = 'item';
      row.innerHTML = `
        <input type="checkbox" id="chk-${key}" onchange="toggleItem('${key}')">
        <div class="item-info">
          <div class="item-name">${item.name}</div>
          ${item.desc ? `<div class="item-desc">${item.desc}</div>` : ''}
          <div class="qty-controls" id="qty-${key}" style="display:none;">
            <button onclick="changeQty('${key}',-1)">−</button>
            <span id="qtynum-${key}">1</span>
            <button onclick="changeQty('${key}',1)">+</button>
          </div>
        </div>
        <div class="item-price">${item.price > 0 ? '$' + item.price.toFixed(2) : ''}</div>
      `;
      itemsDiv.appendChild(row);
    });
    secDiv.appendChild(itemsDiv);
    container.appendChild(secDiv);
  });
}

const selections = {};

function toggleItem(key){
  const chk = document.getElementById(`chk-${key}`);
  const qtyDiv = document.getElementById(`qty-${key}`);
  if(chk.checked){
    selections[key] = 1;
    qtyDiv.style.display = 'flex';
  } else {
    delete selections[key];
    qtyDiv.style.display = 'none';
  }
}

function changeQty(key, delta){
  const cur = selections[key] || 1;
  const next = Math.max(1, cur + delta);
  selections[key] = next;
  document.getElementById(`qtynum-${key}`).textContent = next;
}

function flatMenu(){
  const flat = [];
  MENU.forEach((section, sIdx) => {
    section.items.forEach((item, iIdx) => {
      flat.push({ key: itemKey(sIdx, iIdx), ...item, section: section.section });
    });
  });
  return flat;
}

function copyOrder(){
  const name = document.getElementById('nameInput').value.trim();
  const statusEl = document.getElementById('statusMsg');
  const btn = document.getElementById('submitBtn');
  const originalText = '📋 Copy My Order as Text';

  const showButtonMessage = (msg, color, revert) => {
    btn.textContent = msg;
    btn.style.background = color;
    if(revert){
      setTimeout(() => {
        btn.textContent = originalText;
        btn.style.background = '';
      }, 2500);
    }
  };

  if(!name){
    showButtonMessage('⚠️ Please enter your name first', '#a0342a', true);
    return;
  }
  const chosenKeys = Object.keys(selections);
  if(chosenKeys.length === 0){
    showButtonMessage('⚠️ Pick at least one item first', '#a0342a', true);
    return;
  }
  const flat = flatMenu();
  let total = 0;
  const lines = chosenKeys.map(key => {
    const item = flat.find(f => f.key === key);
    const qty = selections[key];
    const lineTotal = item.price * qty;
    total += lineTotal;
    const priceStr = item.price > 0 ? ` ($${lineTotal.toFixed(2)})` : '';
    return `- ${qty}x ${item.name}${priceStr}`;
  });

  let text = `🌯 ${name}'s Flying Burrito Brothers order:\n${lines.join('\n')}`;
  if(total > 0) text += `\nTotal: $${total.toFixed(2)}`;

  const showCopyFeedback = (ok) => {
    if(ok){
      showButtonMessage('✅ Copied! Paste it into your group chat', '#1e7a44', true);
    } else {
      showButtonMessage('⚠️ Copy failed — see text below', '#a0342a', true);
      statusEl.innerHTML = `<textarea style="width:100%;height:120px;margin-top:8px;padding:8px;">${text}</textarea>`;
    }
  };

  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(() => showCopyFeedback(true)).catch(() => showCopyFeedback(false));
  } else {
    showCopyFeedback(false);
  }
}

renderMenu();
</script>

</body>
</html>
